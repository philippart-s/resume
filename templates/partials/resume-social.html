{#if cdi:social}
<section>
  <h3 class="mb-4 border-b-2 border-section-border pb-2 text-sm font-semibold tracking-wide text-heading uppercase dark:border-section-border-dark dark:text-heading-dark">
    Présence en ligne
  </h3>
  <ul class="space-y-3">
    {#for item in cdi:social.items}
    <li class="text-sm">
      <a class="font-medium text-link underline hover:text-link-hover dark:text-link-dark dark:hover:text-link-hover-dark"
         href="{=item.url}" target="_blank" rel="noopener noreferrer">{=item.name}</a>
      {#if item.type}
      <span class="text-muted dark:text-muted-dark"> — {=item.type}</span>
      {/if}
    </li>
    {/for}
  </ul>
</section>
{/if}
