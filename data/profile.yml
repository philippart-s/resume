bio: |
  Après de nombreuses années passées dans le monde du développement, de
  l'expertise et de l'architecture logicielle j'ai choisi de changer de voie.
  En effet, les relations avec les développeuses et développeurs étant un
  élément très important pour moi j'ai décidé de devenir Developer Advocate.

  Le partage est un élément essentiel pour moi : c'est pourquoi j'ai co-créé
  une association dont le but est d'organiser des meetups autour de l'agilité
  et du DevOps : [TADx](https://www.tadx.fr).

  Toujours dans le but de partager :

  - je suis speaker lors de conférences (l'ensemble de mes conférences est
    disponible [ici](https://noti.st/philippart-s)) ;
  - je suis animateur d'un podcast mensuel
    ([Tranches de Tech](https://podcast.ausha.co/tranches-de-tech)) ;
  - j'anime des [Twitch](https://bit.ly/twitch-replays) ;
  - j'écris des articles pour le magazine Programmez ;
  - j'écris des documentations et blog posts pour mon entreprise ;
  - j'écris des blog posts techniques sur mon
    [blog personnel](https://philippart-s.github.io/blog/).

  Au sein de mes différentes équipes j'ai souvent endossé le rôle de team lead
  (ou tech lead) afin d'organiser au mieux l'équipe mais aussi de définir la
  stratégie de l'équipe.
