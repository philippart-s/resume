- title: Expériences professionnelles
  items:
    - header: "OVHcloud, 2022 → aujourd'hui"
      title: "Senior Developer Advocate & Team Lead"
      content: |
        OVHcloud (Paris, remote) _IA · Cloud native · Java · Python · Docker · Kubernetes_

        - Lead d'une équipe DevRel de 3 personnes pendant 2 ans : encadrement, stratégie d'équipe, budget annuel, onboarding d'un nouvel entrant.
        - **77 talks** en 4 ans (~19/an) sur le circuit européen Java et cloud — Devoxx France, UK, Belgique, Voxxed Days Zurich, Confoo. Audience maximale : 500 personnes. **Un talk sur les CLI IA sélectionné plus de 20 fois par des comités de programme.**
        - Plus de **100 articles techniques** : blog personnel, guides officiels produit, magazine Programmez. Publications atteignant régulièrement ~1 000 interactions professionnelles.
        - **Intégration des produits IA OVHcloud à Docker Model Runner** et correction d'endpoints IA inexploitables dans plusieurs frameworks open source — remontée directe des défauts en amont produit.
        - Premier utilisateur interne des produits IA avant mise sur le marché : détection et remontée aux PM/PO des défauts d'API avant exposition publique.
        - Développement de POC et démos servant de support aux talks et à la documentation officielle.

