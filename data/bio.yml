    - header: "Harmonie Mutuelle, 2008 → 2022"
      title: "Tech Lead / Architecte logiciel & Platform Engineer"
      content: |
        **Harmonie-Mutuelle**, (Tours) _Java · Spring · Jenkins · SonarQube · Docker · Kubernetes · OpenShift_

        - Conception et exploitation des socles applicatifs (Spring, JEE, Angular) et des frameworks internes utilisés par **250 développeurs sur plus de 200 applications**.
        - Conception de la plateforme d'intégration continue — Jenkins 2 en pipelines-as-code, **SonarQube**, GitHub — puis de la chaîne CD sur OpenShift : plusieurs centaines de pipelines en production.
        - **Bootstrap d'un nouveau projet ramené de plusieurs jours (voire semaines) à immédiat** par industrialisation des socles et des pipelines.
        - Tech lead d'une équipe de 5 personnes.

