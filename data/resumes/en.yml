sections:
  - title: Professional experience
    main: true
    items:
      - header: "OVHcloud, 2022 → today"
        title: "Senior Developer Advocate & Team Lead"
        content: |
          OVHcloud (Paris, remote) _AI · Cloud native · Java · Python · Docker · Kubernetes_

          - Led a DevRel team of 3 people for 2 years: management, team strategy, annual budget, onboarding of a new joiner.
          - **77 talks** in 4 years (~19/year): Devoxx France, UK, Belgium, Voxxed Days Zurich, Confoo, ... Largest audience: 500 people. **A talk on AI CLIs selected more than 20 times by programme committees.**
          - More than **100 technical articles**: personal blog, official product guides, Programmez magazine. Publications regularly reaching ~1,000 professional interactions.
          - **Integration of OVHcloud AI products into many tools and frameworks** (Docker Model Runner, LangChain4j, ...).
          - First internal user of the AI products before release: spotting API defects and reporting them to PMs and POs before public exposure.
          - POCs and demos backing the talks and the official documentation.

      - header: "Community & public output"
        title: ""
        content: |
          - **[TADx](https://www.tadx.fr/)**: co-founder of the Tours tech meetup. **70 editions in 7 years**, 20 to 30 attendees per edition.
          - **Tranches de Tech**: co-host of the monthly technical podcast. 30 episodes.
          - **Technical blog**: https://philippart-s.github.io/blog
          - **Talks**: https://philippart-s.github.io/blog/conferences/

      - header: "Harmonie Mutuelle, 2008 → 2022"
        title: "Tech Lead / Software Architect & Platform Engineer"
        content: |
          **Harmonie-Mutuelle**, (Tours) _Java · Spring · Jenkins · SonarQube · Docker · Kubernetes · OpenShift_

          - Designed and ran the application foundations (Spring, JEE, Angular) and the internal frameworks used by **250 developers across more than 200 applications**.
          - Designed the continuous integration platform — Jenkins 2 as pipelines-as-code (several hundred pipelines in production), **SonarQube**, GitHub — then the CD chain on OpenShift.
          - Built a platform engineering offering for 250 developers by industrialising the foundations and the pipelines.
          - Tech lead of a team of 5 people.

      - header: "1999 - 2008"
        title: "Engineer then technical project manager, Java / JEE"
        content: |
          Prima Solutions (Paris), Delta Informatique (Tours), Apside (Tours) - Java - JEE - Weblogic

          - Designed and developed web applications for the banking and insurance sectors.
          - Tech lead and technical project manager over the last years.

