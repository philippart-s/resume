    Depuis plus de 20 ans, mon métier est le même : faire adopter des plateformes techniques par des développeuses et des développeurs. 
    14 ans en interne comme architecte et platform engineer, puis en public depuis 2022 comme Developer Advocate.

    Aujourd'hui je travaille sur l'IA côté développement (RAG, tool calling, MCP, agents) et sur le cloud native. 
    Java reste mon langage d'expertise, Python est mon quotidien sur la partie IA.

