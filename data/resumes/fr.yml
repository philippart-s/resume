sections:
  - title: Expériences professionnelles
    main: true
    items:
      - header: "OVHcloud, 2022 → aujourd'hui"
        title: "Senior Developer Advocate & Team Lead"
        content: |
          OVHcloud (Paris, remote) _IA · Cloud native · Java · Python · Docker · Kubernetes_

          - Lead d'une équipe DevRel de 3 personnes pendant 2 ans : encadrement, stratégie d'équipe, budget annuel, onboarding d'un nouvel entrant.
          - **77 talks** en 4 ans (~19/an) : Devoxx France, UK, Belgique, Voxxed Days Zurich, Confoo, ... Audience maximale : 500 personnes. **Un talk sur les CLI IA sélectionné plus de 20 fois par des comités de programme.**
          - Plus de **100 articles techniques** : blog personnel, guides officiels produit, magazine Programmez. Publications atteignant régulièrement ~1 000 interactions professionnelles.
          - **Intégration des produits IA OVHcloud à de nombreux outils et frameworks** (Docker Model Runner, LangChain4j, ...).
          - Premier utilisateur interne des produits IA avant mise sur le marché : détection et remontée aux PM/PO des défauts d'API avant exposition publique.
          - Développement de POC et démos servant de support aux talks et à la documentation officielle.

      - header: "Communauté & production publique"
        title: ""
        content:  |
          - **[TADx](https://www.tadx.fr/)** : Co-fondateur du meetup tech de Tours. **70 éditions en 7 ans**, 20 à 30 participants par édition.
          - **Tranches de Tech** : Co-animateur du podcast technique mensuel. 30 épisodes.
          - **Blog technique** : https://philippart-s.github.io/blog
          - **Talks** : https://philippart-s.github.io/blog/conferences/

      - header: "Harmonie Mutuelle, 2008 → 2022"
        title: "Tech Lead / Architecte logiciel & Platform Engineer"
        content: |
          **Harmonie-Mutuelle**, (Tours) _Java · Spring · Jenkins · SonarQube · Docker · Kubernetes · OpenShift_

          - Conception et exploitation des socles applicatifs (Spring, JEE, Angular) et des frameworks internes utilisés par **250 développeurs sur plus de 100 applications**.
          - Conception de la plateforme d'intégration continue, Jenkins 2 en pipelines-as-code (plusieurs centaines de pipelines en production), **SonarQube**, GitHub, puis de la chaîne CD sur OpenShift.
          - Mise en place d'une platforme engineering pour 250 développeuses / développeurs par industrialisation des socles et des pipelines.
          - Tech lead d'une équipe de 5 personnes.

      - header: "1999 - 2008"
        title: "Ingénieur puis chef de projet technique Java / JEE"
        content: |
          Prima Solutions (Paris), Delta Informatique (Tours), Apside (Tours) - Java - JEE - Weblogic

          - Développement et conception d'applications web pour les secteurs banque et assurance.
          - Rôle de tech lead et de chef de projet technique sur les dernières années.

